name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push novo no mesmo PR cancela a run anterior (não gasta runner à toa)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate zsh syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zsh
          zsh -n dotfiles/.zshrc
          zsh -n defaultdots/.zshrc

      - name: Check Lua formatting (stylua)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check nvim/

      - name: Lint shell scripts (shellcheck)
        run: shellcheck claude/usage.sh claude/statusline.sh wezterm/sysinfo.sh

      # cmux/cmux.json fica de fora: é JSONC (comentários) por design
      - name: Validate JSON files
        run: |
          for f in claude/settings.json .claude/settings.json nvim/lazy-lock.json; do
            jq empty "$f" && echo "ok $f"
          done

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Validate justfile
        run: |
          just --summary
          just --fmt --check --unstable

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
